<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VIA SANELLA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: black;
      overflow-x: hidden;
    }

    /* background image */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("tarot.jpg") center center / cover no-repeat;
      opacity: 0.25;
      z-index: -1;
      filter: contrast(120%) grayscale(100%);
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 90px;
      letter-spacing: 14px;
      margin: 0;
    }

    p {
      font-size: 16px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .section {
      padding: 120px 20px;
      text-align: center;
    }

    .manifesto {
      max-width: 600px;
      margin: auto;
      line-height: 1.8;
      opacity: 0.85;
    }

    .card {
      margin: 40px auto;
      max-width: 400px;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 20px;
    }

  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="hero">
    <h1>VIA SANELLA</h1>
    <p>AN UNREAL OBJECT / A PERFORMATIVE BRAND</p>
  </div>

  <div class="section">
    <div class="manifesto">
      “This is not fashion. This is not a collection.  
      This is a temporary identity system built from illusion, memory, and absence.”
    </div>
  </div>

  <div class="section">
    <h2>COLLECTION I</h2>

    <div class="card">
      <p>LOOK 01 — THE VOID DRESS</p>
    </div>

    <div class="card">
      <p>LOOK 02 — DISAPPEARING FORM</p>
    </div>

  </div>

</body>
</html>
